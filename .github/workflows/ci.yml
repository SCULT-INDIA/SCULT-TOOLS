name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # The Skills Library's build-time data (generateStaticParams,
    # generateSitemaps) reads Supabase directly. The anon key is public by
    # design (RLS-gated to read-only — see supabase/migrations/0001_create_skills.sql)
    # so it's fine as a plain repo variable rather than a secret.
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Biome replaces ESLint + Prettier. `next lint` was REMOVED in Next 16 and
      # `next build` no longer lints, so this step is the only linting gate.
      - name: Lint + format check
        run: npx biome ci .

      # next-env.d.ts and .next/types are GENERATED, gitignored artifacts —
      # without them a bare tsc can't resolve static-image imports (every
      # `import logo from '@/public/...png'` fails TS2307) or typed routes.
      # Locally they exist because `next dev` has run; `next typegen`
      # produces them without a full build.
      - name: Generate Next.js types
        run: npx next typegen

      - name: Type check
        run: npx tsc --noEmit

      # Includes registry integrity: slug collisions, orphaned tools, dangling
      # `related` references and missing components all fail the build here.
      - name: Unit tests
        run: npx vitest run

      - name: Build
        run: npx next build

      # Fails on a known-critical CVE rather than merely reporting it.
      - name: Dependency audit
        run: npm audit --audit-level=high
